<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
    <defs>
      <linearGradient id="bgGrad_EquipmentUnit" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#09090B" />
        <stop offset="50%" stop-color="#121217" />
        <stop offset="100%" stop-color="#181822" />
      </linearGradient>
      <linearGradient id="boxGrad_XRiteColorQCScanner" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1D4ED8" />
        <stop offset="100%" stop-color="#2563EB" />
      </linearGradient>
      <linearGradient id="foilGrad_XRiteColorQCScanner" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F59E0B" />
        <stop offset="50%" stop-color="#FDE047" />
        <stop offset="100%" stop-color="#D97706" />
      </linearGradient>
      <filter id="glow_XRiteColorQCScanner" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="35" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      <filter id="shadow">
        <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.85" />
      </filter>
    </defs>

    <!-- Background Layer -->
    <rect width="1200" height="800" fill="url(#bgGrad_EquipmentUnit)" />
    
    <!-- Grid Overlay -->
    <g opacity="0.06" stroke="#FFFFFF" stroke-width="1.5">
      <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300 M 0,400 L 1200,400 M 0,500 L 1200,500 M 0,600 L 1200,600 M 0,700 L 1200,700" />
      <path d="M 100,0 L 100,800 M 200,0 L 200,800 M 300,0 L 300,800 M 400,0 L 400,800 M 500,0 L 500,800 M 600,0 L 600,800 M 700,0 L 700,800 M 800,0 L 800,800 M 900,0 L 900,800 M 1000,0 L 1000,800 M 1100,0 L 1100,800" />
    </g>

    <!-- Ambient Glow Spot -->
    <circle cx="680" cy="400" r="380" fill="#60A5FA" opacity="0.16" filter="url(#glow_XRiteColorQCScanner)" />

    <!-- 3D Packaging Rigid Box / Industrial Device Mockup -->
    <g filter="url(#shadow)" transform="translate(380, 170)">
      <!-- Top Surface -->
      <polygon points="260,40 500,130 240,240 0,140" fill="url(#boxGrad_XRiteColorQCScanner)" opacity="0.9" />
      
      <!-- Front Surface -->
      <polygon points="0,140 240,240 240,430 0,330" fill="#2563EB" opacity="0.95" />
      
      <!-- Side Surface -->
      <polygon points="240,240 500,130 500,320 240,430" fill="#1D4ED8" opacity="0.85" />
      
      <!-- Hot Foil Stamp Emblem on Cover -->
      <polygon points="220,130 330,175 220,220 110,175" fill="url(#foilGrad_XRiteColorQCScanner)" opacity="0.92" />
      <text x="220" y="180" font-family="monospace" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle" letter-spacing="3">COLOURPIX</text>
      
      <!-- CAD Dieline Overlay Lines -->
      <polyline points="0,140 260,40 500,130" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-dasharray="8,5" opacity="0.85" />
      <polyline points="240,240 240,430" fill="none" stroke="#60A5FA" stroke-width="2.5" opacity="0.85" />
      <line x1="0" y1="330" x2="500" y2="320" stroke="#60A5FA" stroke-width="1.5" opacity="0.4" />
    </g>

    <!-- Header Badge -->
    <rect x="80" y="65" width="280" height="38" rx="19" fill="#60A5FA" opacity="0.2" stroke="#60A5FA" stroke-width="1.5" />
    <text x="220" y="89" font-family="monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2.5">EQUIPMENT UNIT</text>

    <!-- Step Badge (if applicable) -->
    

    <!-- Main Title -->
    <text x="80" y="160" font-family="sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" letter-spacing="1">X-RITE COLOR QC SCANNER</text>

    <!-- Technical Specs Footer -->
    <g transform="translate(80, 680)">
      <text x="0" y="0" font-family="monospace" font-size="14" fill="#A1A1AA" letter-spacing="2">SPECS: <tspan fill="#FFFFFF" font-weight="bold">HEIDELBERG OFFSET / HOT FOIL / ISO 9001</tspan></text>
      <text x="0" y="25" font-family="monospace" font-size="14" fill="#A1A1AA" letter-spacing="2">INTEGRITY: <tspan fill="#60A5FA" font-weight="bold">100% UNIQUE BESPOKE MOCKUP / DELTA E &lt; 1.0</tspan></text>
    </g>

    <!-- Corner Decorative Frame -->
    <path d="M 50,90 L 50,50 L 90,50" fill="none" stroke="#60A5FA" stroke-width="3" opacity="0.7" />
    <path d="M 1150,90 L 1150,50 L 1110,50" fill="none" stroke="#60A5FA" stroke-width="3" opacity="0.7" />
    <path d="M 50,710 L 50,750 L 90,750" fill="none" stroke="#60A5FA" stroke-width="3" opacity="0.7" />
    <path d="M 1150,710 L 1150,750 L 1110,750" fill="none" stroke="#60A5FA" stroke-width="3" opacity="0.7" />
  </svg>